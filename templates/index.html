<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{title}}</h1>
    <form action="/add" method="POST" >
        <input type="text" name="note" id="">
        <button>Add Note</button>
    </form>
    {% if not notes %}
        <p>No notes yet :)</p>
    {% else %}    
    {% for note in notes %}
        <p>{{note}}</p>
    {% endfor %}
    {% endif %}
</body>
</html>
