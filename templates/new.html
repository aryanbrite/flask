<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Note</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='new.css') }}">

</head>

<body>

<div class="main">

    <header>

        <a href="{{ url_for('home') }}" id="back">
            ← Back
        </a>

        <h1>New Note</h1>

    </header>

    <form
    action="{{ url_for('add') }}"
    method="POST">

        <input
        type="text"
        name="title"
        placeholder="Note Title"
        required
        maxlength="100">

        <textarea
        name="note"
        placeholder="Start writing..."
        rows="18"
        required></textarea>

        <div class="actions">

            <button type="submit">
                Save Note
            </button>

        </div>

    </form>

</div>

</body>
</html>
