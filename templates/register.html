<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>

<body>

<h1>Create Account</h1>

<form method="POST">

        name="username"

        type="password" 
        name="password"
        placeholder="Password"
    >

    <button>
        Register
    </button>

</form>

<a href="/login">
    Already have account?
</a>

</body>
</html>
