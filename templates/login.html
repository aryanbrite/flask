<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="shortcut icon" href="https://cdn.hackclub.com/019fa7be-ff73-7b05-bfe8-06f4a1d2d316/Untitled%20design.png" type="image/x-icon">
</head>

<body>
<div class="main">
    
    <div class="logc">
    
        <h1 id="login" >Welcome Back !</h1>
        <img id="loginimg" src="https://i.pinimg.com/736x/bd/9d/58/bd9d58553949b4601183a950d1d81d92.jpg" alt="">
        <img id="log" src="https://cdn.hackclub.com/019fa7be-ff73-7b05-bfe8-06f4a1d2d316/Untitled%20design.png" alt="">
        <form method="POST">
    
            <input
                type="text"
                name="username"
                placeholder="Username"
                id="user"
            >
    
            <input
                type="password"
                name="password"
                placeholder="Password"
                id="pass"
            >
    
            <button id="logb" >
                Login
            </button>
    
        </form>
    
        <a. id="reg" href="/register">
            Create account
        </a.>
    </div>
</div>

</body>
</html>
