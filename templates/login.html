<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

<h1>Login</h1>

<form method="POST">

    <input 
        type="text" 
        name="username"
        placeholder="Username"
    >

    <input 
        type="password" 
        name="password"
        placeholder="Password"
    >

    <button>
        Login
    </button>

</form>

<a href="/register">
    Create account
</a>

</body>
</html>
